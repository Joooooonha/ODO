name: 배포 (EC2)

# main에 올라간 web-service 변경을 EC2에 반영한다.
#
# **맥미니(분석 서버)는 여기서 배포하지 않는다.** Tailscale 내부망에 있어서
# GitHub의 러너가 닿을 수 없고, 일부러 공인 IP에 노출하지 않았다.
# 분석 서버는 로컬에서 `./deploy/deploy-ai-server.sh`로 올린다.
on:
  push:
    branches: [main]
    paths:
      - 'web-service/**'
      - '.github/workflows/deploy.yml'
  # 코드 변경 없이 다시 올리고 싶을 때(설정만 바뀐 경우 등)
  workflow_dispatch:

# 배포가 겹치면 서로 다른 버전의 jar와 정적 파일이 섞인다.
# 앞의 것을 취소하지 않고 순서대로 처리한다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # **`if:`에서는 `secrets` 컨텍스트를 쓸 수 없다.** 그렇게 썼더니 워크플로 파싱
    # 자체가 실패했다("Unrecognized named-value: 'secrets'"). `env`는 `if`에서
    # 쓸 수 있으므로 여기로 한 번 옮겨서 판단한다.
    env:
      TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: 시크릿 확인
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -z "$KEY" ] && missing="$missing DEPLOY_SSH_KEY"
          [ -z "$HOST" ] && missing="$missing DEPLOY_HOST"
          [ -z "$KNOWN_HOSTS" ] && missing="$missing DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::시크릿이 없습니다:$missing"
            echo "Settings → Secrets and variables → Actions 에서 등록하세요."
            echo "자세한 절차는 DEPLOY-CONSOLE-TASKS.md의 'GitHub Actions' 절 참조."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-service/frontend/package-lock.json

      # ── 검증 ────────────────────────────────────────────
      # 배포 전에 돌린다. 깨진 것을 올리고 나서 되돌리는 것보다 안 올리는 편이 낫다.
      - name: 백엔드 테스트
        working-directory: web-service/api-server
        run: ./gradlew test

      - name: 프론트엔드 린트
        working-directory: web-service/frontend
        run: |
          npm ci
          npx eslint src --max-warnings=0

      # ── 빌드 ────────────────────────────────────────────
      - name: 프론트엔드 빌드
        working-directory: web-service/frontend
        # **빈 값이어야 한다.** 기본값(http://localhost:8080)이 번들에 박히면
        # 배포된 화면이 사용자의 로컬 8080으로 API를 호출한다. 전부 실패하는데
        # 화면은 멀쩡해 보여서 원인을 찾기 어렵다.
        run: VITE_API_BASE_URL= npm run build

      - name: 번들에 localhost가 없는지 확인
        working-directory: web-service/frontend
        run: |
          if grep -rq "localhost:8080" dist/assets/*.js; then
            echo "::error::번들에 localhost:8080이 박혔습니다. VITE_API_BASE_URL 확인 필요."
            exit 1
          fi

      - name: 백엔드 빌드
        working-directory: web-service/api-server
        run: ./gradlew bootJar

      # ── 배포 ────────────────────────────────────────────
      # EC2의 보안 그룹은 22번 포트를 특정 IP에만 연다. GitHub 러너는 매번 다른
      # IP에서 뜨므로 그대로는 닿지 못한다(실제로 Connection timed out으로 실패했다).
      #
      # **22번을 인터넷 전체에 여는 대신 Tailscale로 붙는다.** 러너를 tailnet에
      # 임시 노드로 참여시키면 서버는 공개 IP에서 SSH를 열어둘 필요가 없다.
      # `ephemeral`이라 작업이 끝나면 그 노드는 스스로 사라진다.
      #
      # 시크릿을 넣지 않으면 이 단계를 건너뛰고 공개 IP로 직접 붙는다 —
      # 보안 그룹을 열어 쓰는 쪽을 택했다면 그대로 동작한다.
      # 배포 대상: DEPLOY_HOSTS(공백으로 띄운 여러 서버, 첫 서버 = 앞단 nginx·화면이 있는 앱-1)가 있으면 그것,
      # 없으면 예전처럼 DEPLOY_HOST 한 대(10/21 분산 구성 — 서버 한 대 구성에서도 그대로 동작한다)
      - name: 배포 대상 정하기
        env:
          HOSTS: ${{ secrets.DEPLOY_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          TARGETS="${HOSTS:-$HOST}"
          if [ -z "$TARGETS" ]; then echo "::error::DEPLOY_HOSTS 또는 DEPLOY_HOST가 없습니다"; exit 1; fi
          echo "TARGETS=$TARGETS" >> "$GITHUB_ENV"
          echo "FIRST=${TARGETS%% *}" >> "$GITHUB_ENV"
          echo "배포 대상 $(echo $TARGETS | wc -w)대"

      # EC2의 보안 그룹은 22번을 인터넷에 열지 않는다. 러너를 tailnet에 임시 노드(ephemeral)로 붙여 SSH한다.
      # 시크릿이 없으면 건너뛰고 공개 주소로 붙는다.
      - name: Tailscale 연결
        if: env.TS_CLIENT_ID != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest
          hostname: github-actions-deploy
          ping: ${{ env.FIRST }}

      - name: SSH 준비
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan으로 즉석에서 받지 않는다 — 그러면 중간자를 막지 못한다. 서버마다 한 줄씩 등록해 둔다
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # `tailscale ping`이 통과해도 SSH가 막힐 수 있다(ping은 ACL 포트 규칙을 검사하지 않는다). 모든 서버를 확인한다.
      - name: SSH 도달 확인
        run: |
          failed=""
          for h in $TARGETS; do
            if ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=15 -o BatchMode=yes "ubuntu@$h" true 2>/tmp/ssh_err; then
              echo "✅ SSH 도달 확인 $h"
            else
              echo "::error::SSH로 접속하지 못했습니다: $h"; cat /tmp/ssh_err; failed="$failed $h"
            fi
          done
          if [ -n "$failed" ]; then
            cat <<'HINT'
          ── 확인할 것 ─────────────────────────────────────
          timed out 이라면 포트가 막힌 것입니다(인증 문제가 아님).
            Tailscale ACL에 tag:ci → 서버:22 규칙이 있어야 합니다(deploy/README.md "운영 구성").
          Host key verification failed 라면 DEPLOY_KNOWN_HOSTS에 그 서버 줄이 없습니다(단계 7).
          HINT
            exit 1
          fi

      # 모든 서버에 jar, 첫 서버에만 화면(dist). 아직 바꾸지 않고 /tmp에 둔다
      - name: 업로드
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
          for h in $TARGETS; do
            rsync -a -e "$SSH" web-service/api-server/build/libs/*-SNAPSHOT.jar "ubuntu@$h:/tmp/deploy-app.jar"
          done
          rsync -a --delete -e "$SSH" web-service/frontend/dist/ "ubuntu@$FIRST:/tmp/deploy-dist/"

      # 모든 서버를 멈추고 교체 → 첫 서버 먼저 기동(Flyway) → 나머지 기동. 하나라도 실패하면 모두 직전 버전으로
      # (deploy/scripts/deploy-hosts.sh). 배포마다 약 1분 서비스가 멈춘다 — 옛 버전과 새 버전이 섞이지 않는다
      - name: 반영 + 상태 확인 (실패 시 모두 자동 롤백)
        run: bash deploy/scripts/deploy-hosts.sh $TARGETS

      - name: 배포된 번들 확인
        run: |
          SERVED=$(curl -s https://odostudio.site/ | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1)
          BUILT=$(ls web-service/frontend/dist/assets/index-*.js | xargs -n1 basename)
          echo "빌드: $BUILT / 서빙: ${SERVED#assets/}"
          if [ "$BUILT" != "${SERVED#assets/}" ]; then
            echo "::warning::Cloudflare가 index.html을 캐시하고 있을 수 있습니다. Purge Cache로 / 를 비우세요."
          fi
