name: 배포 (EC2)

# main에 올라간 web-service 변경을 EC2에 반영한다.
#
# **맥미니(분석 서버)는 여기서 배포하지 않는다.** Tailscale 내부망에 있어서
# GitHub의 러너가 닿을 수 없고, 일부러 공인 IP에 노출하지 않았다.
# 분석 서버는 로컬에서 `./deploy/deploy-ai-server.sh`로 올린다.
on:
  push:
    branches: [main]
    paths:
      - 'web-service/**'
      - '.github/workflows/deploy.yml'
  # 코드 변경 없이 다시 올리고 싶을 때(설정만 바뀐 경우 등)
  workflow_dispatch:

# 배포가 겹치면 서로 다른 버전의 jar와 정적 파일이 섞인다.
# 앞의 것을 취소하지 않고 순서대로 처리한다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # **`if:`에서는 `secrets` 컨텍스트를 쓸 수 없다.** 그렇게 썼더니 워크플로 파싱
    # 자체가 실패했다("Unrecognized named-value: 'secrets'"). `env`는 `if`에서
    # 쓸 수 있으므로 여기로 한 번 옮겨서 판단한다.
    env:
      TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: 시크릿 확인
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -z "$KEY" ] && missing="$missing DEPLOY_SSH_KEY"
          [ -z "$HOST" ] && missing="$missing DEPLOY_HOST"
          [ -z "$KNOWN_HOSTS" ] && missing="$missing DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::시크릿이 없습니다:$missing"
            echo "Settings → Secrets and variables → Actions 에서 등록하세요."
            echo "자세한 절차는 DEPLOY-CONSOLE-TASKS.md의 'GitHub Actions' 절 참조."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-service/frontend/package-lock.json

      # ── 검증 ────────────────────────────────────────────
      # 배포 전에 돌린다. 깨진 것을 올리고 나서 되돌리는 것보다 안 올리는 편이 낫다.
      - name: 백엔드 테스트
        working-directory: web-service/api-server
        run: ./gradlew test

      - name: 프론트엔드 린트
        working-directory: web-service/frontend
        run: |
          npm ci
          npx eslint src --max-warnings=0

      # ── 빌드 ────────────────────────────────────────────
      - name: 프론트엔드 빌드
        working-directory: web-service/frontend
        # **빈 값이어야 한다.** 기본값(http://localhost:8080)이 번들에 박히면
        # 배포된 화면이 사용자의 로컬 8080으로 API를 호출한다. 전부 실패하는데
        # 화면은 멀쩡해 보여서 원인을 찾기 어렵다.
        run: VITE_API_BASE_URL= npm run build

      - name: 번들에 localhost가 없는지 확인
        working-directory: web-service/frontend
        run: |
          if grep -rq "localhost:8080" dist/assets/*.js; then
            echo "::error::번들에 localhost:8080이 박혔습니다. VITE_API_BASE_URL 확인 필요."
            exit 1
          fi

      - name: 백엔드 빌드
        working-directory: web-service/api-server
        run: ./gradlew bootJar

      # ── 배포 ────────────────────────────────────────────
      # EC2의 보안 그룹은 22번 포트를 특정 IP에만 연다. GitHub 러너는 매번 다른
      # IP에서 뜨므로 그대로는 닿지 못한다(실제로 Connection timed out으로 실패했다).
      #
      # **22번을 인터넷 전체에 여는 대신 Tailscale로 붙는다.** 러너를 tailnet에
      # 임시 노드로 참여시키면 서버는 공개 IP에서 SSH를 열어둘 필요가 없다.
      # `ephemeral`이라 작업이 끝나면 그 노드는 스스로 사라진다.
      #
      # 시크릿을 넣지 않으면 이 단계를 건너뛰고 공개 IP로 직접 붙는다 —
      # 보안 그룹을 열어 쓰는 쪽을 택했다면 그대로 동작한다.
      - name: Tailscale 연결
        if: env.TS_CLIENT_ID != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest
          # 관리 콘솔에서 이 노드가 무엇인지 알아볼 수 있게. 작업이 끝나면 사라진다.
          hostname: github-actions-deploy
          # 연결됐는지 여기서 확인한다. 안 그러면 rsync 단계에서야 실패해서
          # "SSH 문제인지 tailnet 문제인지" 구분이 안 된다.
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: SSH 준비
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan으로 즉석에서 받지 않는다 — 그러면 중간자를 막지 못한다.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # `tailscale ping`이 통과해도 SSH가 막힐 수 있다. ping은 tailnet 계층에서
      # 응답하는 것이라 **ACL의 포트 규칙을 검사하지 않기 때문이다.**
      # 실제로 ping은 통과하고 rsync만 `Connection timed out`(exit 255)으로 죽어서,
      # 원인이 네트워크인지 인증인지 알 수 없었다. TCP로 한 번 확인하고
      # 실패하면 무엇을 고쳐야 하는지 알려준다.
      - name: SSH 도달 확인
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
                 -o ConnectTimeout=15 -o BatchMode=yes \
                 "ubuntu@$HOST" true 2>/tmp/ssh_err; then
            echo "✅ SSH 도달 확인"
            exit 0
          fi
          echo "::error::SSH로 접속하지 못했습니다."
          cat /tmp/ssh_err
          cat <<'HINT'

          ── 확인할 것 ─────────────────────────────────────
          timed out 이라면 포트가 막힌 것입니다(인증 문제가 아님).

          Tailscale 경로를 쓰는 경우:
            ACL(Access controls)에 tag:ci → 서버:22 규칙이 있어야 합니다.
            `tailscale ping`은 ACL 포트 규칙을 검사하지 않으므로
            앞 단계가 통과했어도 여기서 막힐 수 있습니다.

              "hosts": { "odo-ec2": "100.114.82.112" },
              "acls": [
                { "action": "accept", "src": ["tag:ci"], "dst": ["odo-ec2:22"] }
              ]

          공개 IP를 쓰는 경우:
            AWS 보안 그룹 인바운드에 22번이 열려 있어야 합니다.
          HINT
          exit 1

      - name: 업로드
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
          rsync -a --delete -e "$SSH" \
            web-service/frontend/dist/ "ubuntu@$HOST:/tmp/deploy-dist/"
          rsync -a -e "$SSH" \
            web-service/api-server/build/libs/*-SNAPSHOT.jar "ubuntu@$HOST:/tmp/deploy-app.jar"

      - name: 반영 + 상태 확인 (실패 시 자동 롤백)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "ubuntu@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          # 되돌릴 수 있게 현재 jar를 남긴다. DB 마이그레이션은 Flyway가
          # 기동할 때 적용하므로 사람이 순서를 맞출 필요가 없다.
          sudo cp /opt/dance-api/app.jar /opt/dance-api/app.jar.bak
          # 화면도 함께 남긴다. jar만 되돌리면 새 화면이 옛 API를 부르게 된다.
          # dist.bak은 Nginx root(/var/www/odostudio/dist) 밖이라 외부에 노출되지 않는다.
          # 처음 배포라 dist가 없으면 건너뛴다(set -e에서 멈추지 않게).
          if [ -d /var/www/odostudio/dist ]; then
            sudo rsync -a --delete /var/www/odostudio/dist/ /var/www/odostudio/dist.bak/
          fi
          sudo mv /tmp/deploy-app.jar /opt/dance-api/app.jar
          sudo rsync -a --delete /tmp/deploy-dist/ /var/www/odostudio/dist/
          rm -rf /tmp/deploy-dist
          sudo systemctl restart dance-api

          # 기동을 기다린다. 실측 14초라 넉넉히 잡는다.
          # 마이그레이션이 있으면 조금 더 걸릴 수 있다.
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/api/push/public-key; then
              echo "✅ 기동 확인 (${i}회차)"
              exit 0
            fi
            sleep 3
          done

          echo "❌ 기동하지 못했습니다. 직전 jar로 되돌립니다."
          sudo journalctl -u dance-api -n 40 --no-pager | tail -25
          sudo cp /opt/dance-api/app.jar.bak /opt/dance-api/app.jar
          if [ -d /var/www/odostudio/dist.bak ]; then
            echo "↩️  화면(dist)도 직전 버전으로 되돌립니다."
            sudo rsync -a --delete /var/www/odostudio/dist.bak/ /var/www/odostudio/dist/
          fi
          sudo systemctl restart dance-api
          exit 1
          REMOTE

      - name: 배포된 번들 확인
        run: |
          SERVED=$(curl -s https://odostudio.site/ | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1)
          BUILT=$(ls web-service/frontend/dist/assets/index-*.js | xargs -n1 basename)
          echo "빌드: $BUILT / 서빙: ${SERVED#assets/}"
          if [ "$BUILT" != "${SERVED#assets/}" ]; then
            echo "::warning::Cloudflare가 index.html을 캐시하고 있을 수 있습니다. Purge Cache로 / 를 비우세요."
          fi
