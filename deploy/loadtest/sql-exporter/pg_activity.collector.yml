# 커넥션을 오래 쥐는 원인 구분: 행 잠금 대기 / idle in transaction / 쿼리 자체가 느림
collector_name: pg_activity
min_interval: 0s

metrics:
  # ① 세션 상태 × 대기 유형 개수 (지시서 원문)
  - metric_name: pg_obs_sessions
    type: gauge
    help: client backend sessions by state and wait_event_type (CPU = no wait event)
    key_labels: [state, wait_type]
    values: [sessions]
    query: |
      SELECT state,
             coalesce(wait_event_type, 'CPU') AS wait_type,
             count(*) AS sessions
      FROM pg_stat_activity
      WHERE backend_type = 'client backend'
        AND pid <> pg_backend_pid()
      GROUP BY 1, 2

  # ② 잠금 대기 세션의 대상 테이블 × 잠금 종류 (준하 승인 수정안: chat_room_member를 먼저)
  - metric_name: pg_obs_lock_waiting
    type: gauge
    help: sessions waiting on a lock, by target table (guessed from query text) and wait_event
    key_labels: [target, lock_kind]
    values: [waiting]
    query: |
      SELECT CASE
               WHEN query ILIKE '%chat_room_member%' THEN 'chat_room_member'
               WHEN query ILIKE '%chat_room%'        THEN 'chat_room'
               ELSE 'other'
             END AS target,
             wait_event AS lock_kind,
             count(*) AS waiting
      FROM pg_stat_activity
      WHERE wait_event_type = 'Lock'
      GROUP BY 1, 2

  # ③ 잠금 대기 쿼리의 최대 실행 시간(대기 시간의 상한값)
  - metric_name: pg_obs_max_lock_wait_seconds
    type: gauge
    help: max (now - query_start) among sessions waiting on a lock; upper bound of lock wait
    values: [max_lock_wait_seconds]
    query: |
      SELECT coalesce(max(extract(epoch FROM clock_timestamp() - query_start)), 0)
               AS max_lock_wait_seconds
      FROM pg_stat_activity
      WHERE wait_event_type = 'Lock'
