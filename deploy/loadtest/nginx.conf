# 측정 환경 nginx: 두 서버에 번갈아 보낸다. 웹소켓 블록은 운영(deploy/nginx/odostudio.site.conf)과 같은 모양
# (deploy/local/nginx.conf의 8088 블록과 같다).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream odo_both {
    server app1:8080;
    server app2:8080;
    keepalive 16;
}

server {
    listen 8088;
    location = /api/ws {
        proxy_pass http://odo_both;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $http_host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location / {
        proxy_pass http://odo_both;
        proxy_http_version 1.1;
        proxy_set_header Host       $http_host;
        proxy_set_header Connection "";
    }
}
