# 측정 환경 nginx 본 설정. 공식 이미지 기본값과 다른 것만 이유를 적는다.
user  nginx;
# 운영 EC2는 2 vCPU라 auto = 2. 컨테이너는 cgroup 상한과 상관없이 호스트 CPU 16개를 보므로 auto면 16이 된다 → 2로 고정
worker_processes  2;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    # 운영(Ubuntu 기본)은 768. 웹소켓 하나 = 연결 2개(브라우저 쪽 + 서버 쪽)라 운영값이면 프로세스 2개로 웹소켓 약 768개가
    # 한계다. 측정은 서버 쪽 한계를 보려는 것이므로 nginx가 먼저 막지 않게 올린다(env 기록에 운영과 다른 점으로 적는다)
    worker_connections  16384;
}
worker_rlimit_nofile 40000;

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # 측정 중 접근 로그는 디스크 쓰기만 늘린다
    access_log    off;
    sendfile      on;
    keepalive_timeout  65;
    include /etc/nginx/conf.d/*.conf;
}
