# 운영 모니터링 — 맥미니에서 돈다(10/21, deploy/distributed-rollout.md 단계 10).
#
# 앱 서버 두 대(odo-ec2, odo-app-2)의 관리 포트 9091(/actuator/prometheus)과 node_exporter 9100을 Tailscale로 긁는다.
# 두 컨테이너 모두 host 네트워크 — 맥미니의 Tailscale 주소·MagicDNS를 그대로 쓴다. 바깥에는 열지 않는다:
#   Prometheus 127.0.0.1:9090, Grafana 127.0.0.1:3000. 노트북에서는 SSH 터널로 본다
#   ssh -N -L 3000:127.0.0.1:3000 macmini   → http://localhost:3000
#
# 실행: cd deploy/monitoring && cp targets.example.yml targets.yml (주소 확인) && docker compose up -d
#       Grafana 관리자 비밀번호는 grafana-admin-password 파일(권한 600, 저장소 밖)
name: odo-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.13.4
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./targets.yml:/etc/prometheus/targets.yml:ro,Z
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.1.8
    network_mode: host
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - ./grafana-admin-password:/run/secrets/grafana-admin-password:ro,Z
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
