# 운영 수집 설정. 대상 주소는 targets.yml(저장소 밖, targets.example.yml을 복사)
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # 앱 지표(Micrometer): 관리 포트 9091, prod,monitoring 프로필일 때만 열린다
  - job_name: app
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files: [/etc/prometheus/targets.yml]
    relabel_configs:
      - source_labels: [__address__]
        regex: '.*:9091'
        action: keep

  # 서버 자원(CPU·메모리·디스크): prometheus-node-exporter 9100
  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/targets.yml]
    relabel_configs:
      - source_labels: [__address__]
        regex: '.*:9100'
        action: keep

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:19090']
