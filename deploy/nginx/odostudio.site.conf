# odostudio.site — Nginx (EC2)
#
# 앞단에 Cloudflare가 있고 SSL/TLS 모드는 Full (strict)다.
# 즉 Cloudflare가 이 서버에 **HTTPS로** 접속하고 인증서를 검증한다.
# 그래서 origin에도 인증서가 필요하다 → Cloudflare Origin Certificate 사용
# (무료, 15년, 갱신 불필요. Let's Encrypt처럼 90일마다 갱신하지 않아도 된다).
#
# 배치:
#   /etc/nginx/sites-available/odostudio.site.conf → sites-enabled 심볼릭 링크
#   인증서: /etc/ssl/cloudflare/odostudio.site.pem  (Origin Certificate)
#   개인키: /etc/ssl/cloudflare/odostudio.site.key  (권한 600)

# ---------------------------------------------------------------------------
# Cloudflare 실제 방문자 IP 복원
# ---------------------------------------------------------------------------
# 이게 없으면 모든 요청의 출발지가 Cloudflare IP로 찍혀서, 접근 로그가 쓸모없어지고
# IP 기반 제한도 전부 무의미해진다.
# 목록 최신본: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# 웹소켓 업그레이드 헤더. 업그레이드 요청이면 Connection: upgrade, 아니면 close.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Spring 백엔드
upstream dance_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS
# ---------------------------------------------------------------------------
# Cloudflare의 "Always Use HTTPS"가 대부분 막아주지만, EC2 IP로 직접 들어오는
# 요청도 있으므로 origin에서도 막는다.
server {
    listen 80;
    listen [::]:80;
    server_name odostudio.site www.odostudio.site;
    return 301 https://odostudio.site$request_uri;
}

# ---------------------------------------------------------------------------
# www → 정식 도메인
# ---------------------------------------------------------------------------
# 쿠키는 odostudio.site에 굽히므로 www로 들어오면 로그인이 풀린 것처럼 보인다.
# 하나로 모은다.
server {
    # nginx 1.25부터 `http2 on;`이 생겼다. Ubuntu 24.04는 1.24.0이라
    # listen 줄에 http2를 붙이는 구문법을 쓴다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.odostudio.site;

    ssl_certificate     /etc/ssl/cloudflare/odostudio.site.pem;
    ssl_certificate_key /etc/ssl/cloudflare/odostudio.site.key;

    return 301 https://odostudio.site$request_uri;
}

# ---------------------------------------------------------------------------
# 본체
# ---------------------------------------------------------------------------
server {
    # nginx 1.25부터 `http2 on;`이 생겼다. Ubuntu 24.04는 1.24.0이라
    # listen 줄에 http2를 붙이는 구문법을 쓴다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name odostudio.site;

    ssl_certificate     /etc/ssl/cloudflare/odostudio.site.pem;
    ssl_certificate_key /etc/ssl/cloudflare/odostudio.site.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 프론트엔드 정적 파일 (vite build 결과물)
    root /var/www/odostudio/dist;
    index index.html;

    # 영상은 브라우저 ↔ R2로 직접 오간다. 이 서버를 지나는 것은 JSON뿐이라
    # 본문 크기를 크게 잡을 이유가 없다. 크게 두면 그만큼 공격 표면이 넓어진다.
    client_max_body_size 2m;

    # 보안 헤더
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # HSTS는 Cloudflare에서 켜는 편이 안전하다(잘못 켜면 되돌리기 어렵다).

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- 채팅 웹소켓 (STOMP) ----
    #
    # 아래 /api 블록은 upstream keepalive 때문에 Connection 헤더를 비운다
    # (proxy_set_header Connection "") — 그대로면 웹소켓 업그레이드가 막힌다.
    # 그래서 웹소켓 엔드포인트 하나만 따로 둔다. `=`(정확히 일치)는 정규식 블록보다
    # 먼저 선택된다. 유휴 제한 60초 > 하트비트 10초.
    location = /api/ws {
        proxy_pass http://dance_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---- 백엔드로 넘기는 경로 ----
    #
    # 규칙은 단순하다: /api 로 시작하면 백엔드, 나머지는 프론트엔드.
    #
    # 처음에는 경로를 하나씩 나열했는데(`videos|practice-logs|assignments|...`)
    # **프론트엔드 SPA 라우팅과 겹쳤다.** `/assignments`는 숙제 목록 화면이면서
    # 동시에 API였고, `/login`도 로그인 화면인데 백엔드로 넘어가 Spring의 404
    # 페이지가 떴다. 경로만 보고는 구분할 수 없어서 컨트롤러 전체를 /api 아래로
    # 옮겼다 (WebMvcConfig.configurePathMatch).
    #
    # OAuth 경로만 예외다. Spring Security 필터가 처리해 /api 접두사가 붙지 않고,
    # 경로를 바꾸면 카카오·네이버 콘솔에 등록한 Redirect URI도 바꿔야 한다.
    location ~ ^/(api|oauth2|login/oauth2)(/|$) {
        proxy_pass http://dance_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Spring이 https로 인식해야 OAuth redirect_uri가 http로 새어나가지 않는다.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # 분석 요청은 202로 즉시 돌아오고 진행 상황은 폴링으로 확인하므로
        # 긴 타임아웃이 필요 없다.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # 정적 자산은 파일명에 해시가 붙으므로 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 폴백. /logs/3 같은 주소를 새로고침해도 index.html이 떠야 한다.
    # manifest는 확장자가 .webmanifest라 nginx 기본 MIME 표에 없다.
    # 지정하지 않으면 application/octet-stream으로 나가고, 브라우저가
    # "홈 화면에 추가"를 제안하지 않는다 — iOS에서는 그러면 푸시도 못 쓴다.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # 서비스 워커는 캐시하면 안 된다.
    #
    # 브라우저가 예전 워커를 계속 쓰면 알림 동작을 고쳐도 반영되지 않는다.
    # /assets/ 와 달리 파일명에 해시가 없어서(등록 경로가 고정이라 붙일 수 없다)
    # 캐시를 그대로 두면 언제 갱신될지 알 수 없다.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
