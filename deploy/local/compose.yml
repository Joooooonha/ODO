# 로컬 개발·검증 전용. 운영은 jar + systemd 그대로다(Docker를 쓰지 않는다).
#
#   docker compose -f deploy/local/compose.yml up -d postgres redis   # 개발용(bootRun이 붙는다)
#
#   # 서버 2대 시연·검증: jar를 먼저 만든다
#   (cd web-service/api-server && ./gradlew bootJar)
#   docker compose -f deploy/local/compose.yml --profile multi up -d
#     → http://localhost:8088  nginx, 두 서버에 번갈아 보냄(웹소켓 포함)
#     → http://localhost:8081  app1 고정, http://localhost:8082  app2 고정
#   화면은 Vite를 두 번 띄워 서버를 나눠 붙인다:
#     VITE_API_BASE_URL=http://localhost:8081 npm run dev -- --port 5173
#     VITE_API_BASE_URL=http://localhost:8082 npm run dev -- --port 5174
#   (쿠키는 포트를 가리지 않으므로 사용자 두 명은 브라우저 프로필 두 개로 로그인한다)
name: odo-local

x-app: &app
  # 운영과 같은 Java 17
  image: eclipse-temurin:17-jre
  profiles: ["multi"]
  volumes:
    - ../../web-service/api-server/build/libs:/app:ro
  command: ["sh", "-c", "exec java -jar /app/Dance-Assessment-0.0.1-SNAPSHOT.jar"]
  environment:
    SPRING_PROFILES_ACTIVE: dev
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dance_db
    SPRING_DATA_REDIS_HOST: redis
    CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:8088,http://localhost:8081,http://localhost:8082
    STORAGE_LOCAL_DIR: /tmp/storage-data
  healthcheck:
    # 이미지에 curl이 없어 셸의 /dev/tcp로 포트가 열렸는지만 본다
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
    interval: 3s
    timeout: 2s
    retries: 40

services:
  postgres:
    # 운영과 같은 메이저 버전(운영 16.15)
    image: postgres:16
    environment:
      POSTGRES_DB: dance_db
      POSTGRES_USER: dance
      POSTGRES_PASSWORD: dance
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dance -d dance_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    # 운영은 Ubuntu 24.04 apt의 redis-server(7.0 계열). Pub/Sub만 쓰고 영속화하지 않는다.
    image: redis:7.0-alpine
    command: ["redis-server", "--requirepass", "localdev", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "localdev", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  app1:
    <<: *app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  app2:
    <<: *app
    # app1이 뜬 뒤에 띄운다. 둘이 동시에 뜨면 개발용 시드 계정(InitDb)이 두 번 만들어진다
    # (users.login_id에 UNIQUE가 없다 — 백로그).
    depends_on:
      app1: { condition: service_healthy }

  nginx:
    # 운영 nginx와 같은 1.24
    image: nginx:1.24-alpine
    profiles: ["multi"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:8088"
      - "8081:8081"
      - "8082:8082"
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }

volumes:
  postgres-data:
