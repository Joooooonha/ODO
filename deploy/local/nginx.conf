# 로컬 서버 2대 앞단. 웹소켓 블록은 운영(deploy/nginx/odostudio.site.conf)과 같은 모양이다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream odo_both {
    server app1:8080;
    server app2:8080;
    keepalive 16;
}

upstream odo_app1 { server app1:8080; }
upstream odo_app2 { server app2:8080; }

# 8088: 두 서버에 번갈아 보낸다(웹소켓 연결도 연결마다 번갈아 붙는다)
server {
    listen 8088;
    location = /api/ws {
        proxy_pass http://odo_both;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $http_host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location / {
        proxy_pass http://odo_both;
        proxy_http_version 1.1;
        proxy_set_header Host       $http_host;
        proxy_set_header Connection "";
    }
}

# 8081 / 8082: 서버 하나에 고정(어느 서버에 붙었는지 정해 두고 시험할 때)
server {
    listen 8081;
    location = /api/ws {
        proxy_pass http://odo_app1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $http_host;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://odo_app1;
        proxy_set_header Host $http_host;
    }
}

server {
    listen 8082;
    location = /api/ws {
        proxy_pass http://odo_app2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $http_host;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://odo_app2;
        proxy_set_header Host $http_host;
    }
}
