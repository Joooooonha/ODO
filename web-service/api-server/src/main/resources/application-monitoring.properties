# ==========================================
# 운영 모니터링 (10/21). SPRING_PROFILES_ACTIVE=prod,monitoring 으로 운영 설정 위에 덮는다.
# 맥미니의 Prometheus가 Tailscale로 긁는다(deploy/monitoring, deploy/distributed-rollout.md 단계 10).
# ==========================================
# 관리 포트(9091)로만 내보낸다. 앱 포트(8080)에는 actuator가 없다.
# 9091은 보안 그룹에 열지 않는다(인터넷·사설망에서 닿지 않음). Tailscale ACL로 맥미니에서만 닿는다.
management.server.port=${MANAGEMENT_SERVER_PORT:9091}
# 기본 설정의 exclude=*는 include보다 우선이라 비워서 덮어야 한다
management.endpoints.web.exposure.exclude=
management.endpoints.web.exposure.include=prometheus,health
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true
