spring.application.name=Dance-Assessment
spring.profiles.active=dev

# ==========================================
# 1. 데이터베이스 (PostgreSQL)
# ==========================================
# 접속 정보는 프로파일·환경이 준다.
#   dev  : application-dev.properties (로컬 Docker PostgreSQL)
#   prod : /etc/dance-api.env의 SPRING_DATASOURCE_*
#   테스트: Testcontainers가 띄운 PostgreSQL (src/test의 PostgresTestContainer)

# ==========================================
# 2. JPA & Hibernate
# ==========================================
# 어느 환경이든 스키마를 바꾸는 경로는 Flyway 하나다. Hibernate는 엔티티와 실제
# 스키마가 맞는지 검증만 한다. 예전에는 개발·테스트가 H2에서 ddl-auto=update로
# 스키마를 만들어서, 마이그레이션에만 있는 제약(부분 인덱스 등)이 테스트에 없었다.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 3. 업로드 크기 (기본 1MB -> 100MB)
# ==========================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ==========================================
# 4. 인증
# ==========================================
# JWT 서명 키. HS256이라 32바이트 이상이어야 한다.
# 운영에서는 반드시 환경변수(JWT_SECRET)로 덮어쓴다 - 이 값은 개발 전용이다.
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-in-production-32bytes}

# 쿠키에 Secure 플래그를 붙일지. 로컬은 http라 false여야 쿠키가 저장된다.
# 운영(HTTPS)에서는 반드시 true.
app.cookie.secure=${COOKIE_SECURE:false}

# 소셜 로그인 성공 후 돌아갈 프론트엔드 주소
app.frontend.redirect-uri=${FRONTEND_REDIRECT_URI:http://localhost:5173}

# CORS 허용 오리진. 쿠키를 주고받으므로 와일드카드를 쓸 수 없다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# ==========================================
# 5. 저장소 (영상 원본 + 분석 결과물)
# ==========================================
# local: 로컬 디스크 (개발용, 자격증명 불필요)
# r2   : Cloudflare R2 (배포용)
storage.type=${STORAGE_TYPE:local}

storage.local.dir=${STORAGE_LOCAL_DIR:./storage-data}
storage.local.base-url=${STORAGE_LOCAL_BASE_URL:http://localhost:8080}

# 실제 값은 application-secret.properties 또는 환경변수로 주입한다.
# 발급 절차는 DEPLOY-CONSOLE-TASKS.md 참고.
#
# **기본값을 두지 않는다.** storage.type=r2인데 값이 비면 AWS SDK가
# 알아보기 힘든 NullPointerException을 던진다. 기본값이 없으면 Spring이
# "Could not resolve placeholder 'R2_BUCKET'"으로 무엇이 빠졌는지 알려준다.
# storage.type=local일 때는 이 빈 자체가 만들어지지 않아 평가되지 않는다.
storage.r2.bucket=${R2_BUCKET}
storage.r2.endpoint=${R2_ENDPOINT}
storage.r2.access-key=${R2_ACCESS_KEY}
storage.r2.secret-key=${R2_SECRET_KEY}

# ==========================================
# 6. AI 분석 서버
# ==========================================
# 배포 시 맥미니의 Tailscale IP로 바꾼다 (예: http://100.x.x.x:8000)
ai.server.url=${AI_SERVER_URL:http://localhost:8000}

# ==========================================
# 7. 소셜 로그인 (카카오 / 네이버)
# ==========================================
# 실제 키는 application-secret.properties 또는 환경변수로 주입한다.
# 콘솔 등록 절차는 DEPLOY-CONSOLE-TASKS.md 참고.
spring.config.import=optional:classpath:application-secret.properties

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=nickname
spring.security.oauth2.client.registration.naver.client-name=Naver

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# ==========================================
# 8. Redis (채팅 서버 간 전달 — Pub/Sub만 쓴다)
# ==========================================
# 접속 정보는 프로파일이 준다(dev: application-dev.properties, prod: 환경 변수, 테스트: Testcontainers).
#
# 명령 시간 제한을 짧게 둔다. Lettuce 기본값은 60초이고, 연결이 끊긴 동안 들어온 명령을 대기열에
# 쌓아 둔다. 그러면 Redis가 멈춘 동안 발행 한 건이 메시지 처리 스레드를 최대 60초 붙잡아
# 하트비트까지 밀린다. 끊긴 동안의 명령은 RedisConfig에서 즉시 거절하게 한다.
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=2s

# ==========================================
# 9. 지표 (Micrometer)
# ==========================================
# HTTP·JMX로는 아무것도 노출하지 않는다. 지표는 서버 메모리에만 있고, 주기적으로 로그에 요약한다
# (journalctl -u dance-api 로 본다). 측정 환경은 loadtest 프로필이 여기를 덮는다(application-loadtest.properties).
management.endpoints.web.exposure.exclude=*
management.endpoints.jmx.exposure.exclude=*
# Prometheus 레지스트리는 jar에 들어 있지만(운영과 같은 jar를 측정하려고) 기본은 끈다 — 운영에서는 만들지도 않는다
management.prometheus.metrics.export.enabled=false
chat.metrics.log-interval=60s

# ==========================================
# 10. 읽음 벌크헤드 (Task-chat-read-improve 3절)
# ==========================================
# 서버 한 대에서 동시에 처리하는 읽음 보고 수의 상한 K. 넘치면 기다리지 않고 429(READ_BUSY).
# 0이면 끈다(기준선과 같다). 운영 기본값은 병합 전에 정한다 — 그전까지 0.
chat.read.bulkhead.max-concurrent=${CHAT_READ_BULKHEAD:0}
# 메시지 처리(STOMP 인바운드) 스레드 수(10/20 작업 3-2). 0이면 Spring 기본값 CPU × 2(ChatWebSocketConfig)
chat.ws.inbound-threads=${CHAT_WS_INBOUND_THREADS:0}
# 메시지 발행을 커넥션 반납 뒤로(같은 스레드·동기, 10/20 작업 3-2 조건부 E, PublishDeferral). 기본 끔 = 커밋 뒤 정리 전에 발행
chat.send.publish-after-release=${CHAT_PUBLISH_AFTER_RELEASE:false}
# 서버 쪽 읽음 모으기(10/20 작업 4, ReadAggregator). 기본 끔 = 보고마다 처리(기준선). 서버 순번·수는 compose가 서버마다 준다(처리 위상 i × 500 / N)
chat.read.aggregate.enabled=${CHAT_READ_AGGREGATE:false}
chat.read.aggregate.server-index=${CHAT_SERVER_INDEX:0}
chat.read.aggregate.server-count=${CHAT_SERVER_COUNT:1}
chat.read.aggregate.phase-ms=${CHAT_READ_AGGREGATE_PHASE:-1}
