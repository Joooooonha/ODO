# ==========================================
# 측정 환경 전용 (Task-chat-read 5·7절). SPRING_PROFILES_ACTIVE=prod,loadtest 로 운영 설정 위에 덮는다.
# 운영에서는 절대 켜지 않는다. 비밀값(JWT_SECRET 등)은 측정 전용 값만 넣는다 — 운영 값을 넣지 않는다.
# ==========================================

# LAN은 http다. Secure 쿠키는 http에서 브라우저가 보내지 않으므로 끈다(생성기는 쿠키를 직접 싣는다)
app.cookie.secure=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend.redirect-uri=${FRONTEND_REDIRECT_URI:http://localhost:8088}

# 영상 저장소는 쓰지 않는다(R2 키가 필요 없게)
storage.type=local
storage.local.dir=/tmp/storage-data

# 요약 로그·백분위수 구간 10초
chat.metrics.log-interval=10s

# Prometheus: 관리 포트(9091)로만, 컨테이너 네트워크 안에서만 연다(포트를 밖으로 내보내지 않는다).
# 기본 설정의 exclude=*는 include보다 우선이라 비워서 덮어야 한다.
management.prometheus.metrics.export.enabled=true
management.server.port=9091
management.endpoints.web.exposure.exclude=
management.endpoints.web.exposure.include=prometheus,health
