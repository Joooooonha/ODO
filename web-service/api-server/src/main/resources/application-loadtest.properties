# ==========================================
# 측정 환경 전용 (Task-chat-read 5·7절). SPRING_PROFILES_ACTIVE=prod,loadtest 로 운영 설정 위에 덮는다.
# 운영에서는 절대 켜지 않는다. 비밀값(JWT_SECRET 등)은 측정 전용 값만 넣는다 — 운영 값을 넣지 않는다.
# ==========================================

# LAN은 http다. Secure 쿠키는 http에서 브라우저가 보내지 않으므로 끈다(생성기는 쿠키를 직접 싣는다)
app.cookie.secure=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend.redirect-uri=${FRONTEND_REDIRECT_URI:http://localhost:8088}

# 영상 저장소는 쓰지 않는다(R2 키가 필요 없게)
storage.type=local
storage.local.dir=/tmp/storage-data

# 요약 로그·백분위수 구간 10초
chat.metrics.log-interval=10s

# Prometheus: 관리 포트(9091)로만, 컨테이너 네트워크 안에서만 연다(포트를 밖으로 내보내지 않는다).
# 기본 설정의 exclude=*는 include보다 우선이라 비워서 덮어야 한다.
management.prometheus.metrics.export.enabled=true
management.server.port=9091
management.endpoints.web.exposure.exclude=
# loadtest: 측정 전용 장애 주입(LoadtestFaultEndpoint, 이 프로필에서만 빈이 생긴다)
management.endpoints.web.exposure.include=prometheus,health,loadtest

# 스레드 풀별 CPU 시간(ThreadCpuMetrics)과 Tomcat 사용 중 스레드 수(tomcat.threads.busy) — 과부하 때 메시지와 읽음의
# CPU 몫을 숫자로 보려고(Task-chat-read-improve 4절). 측정에서만 켠다
chat.metrics.thread-cpu=true
# 메시지 1건 단계 분해(SendStages)·모으기 느린 주기 기록(ReadAggregator) — 측정에서만 켠다(운영 기본 끔, 10/21)
chat.metrics.send-stages=true
chat.metrics.read-agg-slow=true
server.tomcat.mbeanregistry.enabled=true
