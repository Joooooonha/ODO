# 개발 프로파일 (로컬)
#
# DB는 로컬 Docker의 PostgreSQL 16이다(운영과 같은 메이저 버전).
#   docker compose -f deploy/local/compose.yml up -d postgres
# 데이터는 Docker 볼륨에 남는다. 처음부터 다시 하려면 `down -v`.
#
# 환경 변수 SPRING_DATASOURCE_URL 등을 주면 아래 값을 덮어쓴다
# (Compose 안에서 앱을 띄울 때 호스트 이름이 postgres가 되는 경우).
spring.datasource.url=jdbc:postgresql://localhost:5432/dance_db
spring.datasource.username=dance
spring.datasource.password=dance
