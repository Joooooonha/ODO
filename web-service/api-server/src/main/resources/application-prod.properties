# 운영 프로파일 (odostudio.site)
#
# 실행: SPRING_PROFILES_ACTIVE=prod
# 비밀값은 전부 환경변수로 주입한다. 이 파일에 키를 적지 말 것.
# 발급 절차는 DEPLOY-CONSOLE-TASKS.md 참고.

# ==========================================
# 프록시 뒤에서 동작 (Cloudflare → Nginx → Spring)
# ==========================================
# **이 설정이 없으면 소셜 로그인이 깨진다.**
# Spring은 자기가 http://localhost:8080에 있다고 생각하므로, OAuth 설정의
# {baseUrl}이 그대로 치환돼 카카오·네이버에 `http://localhost:8080/login/...`을
# redirect_uri로 보낸다. 콘솔에 등록한 값과 달라 거부되고,
# 설령 통과해도 사용자를 localhost로 돌려보낸다.
#
# Nginx가 넘겨주는 X-Forwarded-Proto/Host를 신뢰해 https://odostudio.site로
# 인식하게 한다.
server.forward-headers-strategy=native

# ==========================================
# 인증
# ==========================================
# HTTPS 전용. Cloudflare가 앞단이라 브라우저~엣지 구간은 항상 TLS다.
app.cookie.secure=true

# 소셜 로그인 성공 후 돌아갈 곳
app.frontend.redirect-uri=https://odostudio.site

# 프론트와 API가 같은 도메인이라 사실상 CORS가 필요 없지만,
# www 접속이나 프리뷰 배포를 대비해 명시해 둔다.
app.cors.allowed-origins=https://odostudio.site,https://www.odostudio.site

# ==========================================
# 저장소 (Cloudflare R2)
# ==========================================
storage.type=r2

# ==========================================
# AI 분석 서버 (맥미니, Tailscale 내부망)
# ==========================================
# 공인 IP로 노출하지 않는다. 이 서버에는 인증이 없고,
# 접근 통제를 "네트워크에서 닿을 수 없다"에 의존한다.
# 예: http://100.x.x.x:8000
ai.server.url=${AI_SERVER_URL}

# ==========================================
# 운영에서 꺼지는 것
# ==========================================
# - DevAuthController (아이디/비밀번호 로그인·회원가입) → 404
# - InitDb (테스트 계정 시드) → 로드되지 않음
# 둘 다 @Profile("dev")가 붙은 **클래스**다.
# (메서드에 붙이면 아무 효과가 없다 — ProdProfileTest로 고정해 두었다)

# 운영 DB는 매번 스키마를 건드리지 않는다. 컬럼 추가가 필요하면 의도적으로 바꿀 것.
# ── 스키마 ─────────────────────────────────────────────
#
# Flyway가 먼저 마이그레이션을 적용하고, 그 다음 Hibernate가 엔티티 매핑과
# 실제 스키마가 맞는지 검증한다. 이 조합이 핵심이다 —
#   Flyway  : 스키마를 "바꾸는" 유일한 경로 (기동할 때 자동)
#   validate: 엔티티와 스키마가 어긋나면 기동을 거부 (조용한 불일치 방지)
#
# ddl-auto를 update로 두지 않는 이유: Hibernate가 스키마를 추측해서 고치면
# 무엇이 언제 바뀌었는지 기록이 남지 않고, 컬럼 삭제·타입 변경은 하지도 않는다.
spring.flyway.enabled=true

# **이미 테이블이 다 있는 DB에 Flyway를 나중에 붙였다.**
# 비어 있지 않은 스키마를 만나면 이력 테이블에 "V1까지는 적용됨"이라고 표시만 하고
# V1을 실행하지 않는다. 그 뒤의 V2, V3...만 실제로 적용된다.
# 빈 DB(새 서버, 로컬 PostgreSQL)에서는 V1부터 전부 실행돼 스키마가 만들어진다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# ASCII로 적는다. 한글을 넣었더니 이력 테이블에 깨진 바이트로 들어갔다
# (properties → Flyway → JDBC 사이 어딘가의 인코딩 문제). 기계용 표식이라
# 굳이 한글일 이유가 없다.
spring.flyway.baseline-description=Pre-Flyway schema (see V1__baseline_schema.sql)

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
