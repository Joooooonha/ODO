# 운영 프로파일 (odostudio.site)
#
# 실행: SPRING_PROFILES_ACTIVE=prod
# 비밀값은 전부 환경변수로 주입한다. 이 파일에 키를 적지 말 것.
# 발급 절차는 DEPLOY-CONSOLE-TASKS.md 참고.

# ==========================================
# 프록시 뒤에서 동작 (Cloudflare → Nginx → Spring)
# ==========================================
# **이 설정이 없으면 소셜 로그인이 깨진다.**
# Spring은 자기가 http://localhost:8080에 있다고 생각하므로, OAuth 설정의
# {baseUrl}이 그대로 치환돼 카카오·네이버에 `http://localhost:8080/login/...`을
# redirect_uri로 보낸다. 콘솔에 등록한 값과 달라 거부되고,
# 설령 통과해도 사용자를 localhost로 돌려보낸다.
#
# Nginx가 넘겨주는 X-Forwarded-Proto/Host를 신뢰해 https://odostudio.site로
# 인식하게 한다.
server.forward-headers-strategy=native

# ==========================================
# 인증
# ==========================================
# HTTPS 전용. Cloudflare가 앞단이라 브라우저~엣지 구간은 항상 TLS다.
app.cookie.secure=true

# ── 비밀값: 운영에서는 기본값을 두지 않는다 ─────────────────────────
# 기본 설정 파일의 개발용 기본값(저장소에 공개된 JWT 키, 소셜 로그인 dummy)이 운영에서 조용히 쓰이지
# 않게 덮어쓴다. /etc/dance-api.env에서 빠지면 기동이 실패한다(ProdSecretsCheck).
#   - JWT_SECRET이 빠진 채 개발용 키로 뜨면 누구나 로그인 토큰을 위조할 수 있다
#   - 소셜 로그인 키가 dummy로 뜨면 로그인만 조용히 깨진다
jwt.secret=${JWT_SECRET}
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}

# 소셜 로그인 성공 후 돌아갈 곳
app.frontend.redirect-uri=https://odostudio.site

# 프론트와 API가 같은 도메인이라 사실상 CORS가 필요 없지만,
# www 접속이나 프리뷰 배포를 대비해 명시해 둔다.
app.cors.allowed-origins=https://odostudio.site,https://www.odostudio.site

# ==========================================
# 저장소 (Cloudflare R2)
# ==========================================
storage.type=r2

# ==========================================
# Redis (채팅 서버 간 전달)
# ==========================================
# **기본값을 두지 않는다.** /etc/dance-api.env에서 빠뜨리면 기동이 실패하고("spring.data.redis.password
# 값이 설정되지 않았습니다"), 배포 기동 확인이 실패해 직전 jar로 자동 롤백된다. 기본값이 있으면 Redis
# 없이 떠서 저장은 되는데 아무에게도 실시간 전달이 안 되는 상태로 배포가 "성공"한다.
# 주의: 이 값들은 @ConfigurationProperties로 묶여서, 해석 못 한 자리 표시자가 실패하지 않고 글자 그대로
# 남는다. 그래서 RedisConfig가 기동 때 직접 확인한다(@Value로 읽는 R2_*와 다르다).
# 서버 안(127.0.0.1)에서만 접속한다.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# ==========================================
# AI 분석 서버 (맥미니, Tailscale 내부망)
# ==========================================
# 공인 IP로 노출하지 않는다. 이 서버에는 인증이 없고,
# 접근 통제를 "네트워크에서 닿을 수 없다"에 의존한다.
# 예: http://100.x.x.x:8000
ai.server.url=${AI_SERVER_URL}

# ==========================================
# 운영에서 꺼지는 것
# ==========================================
# - DevAuthController (아이디/비밀번호 로그인·회원가입) → 404
# - InitDb (테스트 계정 시드) → 로드되지 않음
# 둘 다 @Profile("dev")가 붙은 **클래스**다.
# (메서드에 붙이면 아무 효과가 없다 — ProdProfileTest로 고정해 두었다)

# 운영 DB는 매번 스키마를 건드리지 않는다. 컬럼 추가가 필요하면 의도적으로 바꿀 것.
# ── 스키마 ─────────────────────────────────────────────
#
# Flyway가 먼저 마이그레이션을 적용하고, 그 다음 Hibernate가 엔티티 매핑과
# 실제 스키마가 맞는지 검증한다. 이 조합이 핵심이다 —
#   Flyway  : 스키마를 "바꾸는" 유일한 경로 (기동할 때 자동)
#   validate: 엔티티와 스키마가 어긋나면 기동을 거부 (조용한 불일치 방지)
#
# ddl-auto를 update로 두지 않는 이유: Hibernate가 스키마를 추측해서 고치면
# 무엇이 언제 바뀌었는지 기록이 남지 않고, 컬럼 삭제·타입 변경은 하지도 않는다.
spring.flyway.enabled=true

# **이미 테이블이 다 있는 DB에 Flyway를 나중에 붙였다.**
# 비어 있지 않은 스키마를 만나면 이력 테이블에 "V1까지는 적용됨"이라고 표시만 하고
# V1을 실행하지 않는다. 그 뒤의 V2, V3...만 실제로 적용된다.
# 빈 DB(새 서버, 로컬 PostgreSQL)에서는 V1부터 전부 실행돼 스키마가 만들어진다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# ASCII로 적는다. 한글을 넣었더니 이력 테이블에 깨진 바이트로 들어갔다
# (properties → Flyway → JDBC 사이 어딘가의 인코딩 문제). 기계용 표식이라
# 굳이 한글일 이유가 없다.
spring.flyway.baseline-description=Pre-Flyway schema (see V1__baseline_schema.sql)

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ==========================================
# 채팅 운영 기본값 (10/21 측정으로 채택 — load-test/results/2026-10-21-improve-v3/README.md "개선별 정리")
# ==========================================
# 개발·테스트 기본값(application.properties)은 기준선 그대로 두고, 운영만 여기서 켠다. 환경 변수로 덮을 수 있다
# (측정 compose는 실행마다 값을 직접 준다).
# 메시지 처리 스레드 8개: 처리 시간 대부분이 DB 커밋 대기라(1건 약 4ms 중 CPU 약 0.4ms) 코어 수보다 많이 둔다.
# Hikari 풀(10)보다 적게 둔다 — 읽음·HTTP 요청 몫을 남긴다
chat.ws.inbound-threads=${CHAT_WS_INBOUND_THREADS:8}
# 서버 쪽 읽음 모으기(500ms 주기). 서버가 한 대라 순번 0, 수 1 → 위상 0ms. 서버를 늘리면 CHAT_SERVER_INDEX·CHAT_SERVER_COUNT를 준다
chat.read.aggregate.enabled=${CHAT_READ_AGGREGATE:true}
# 읽음 벌크헤드는 큰 K의 안전망(모으기를 켜면 동시 처리 수 L ≈ 0 → K = max(32, 10 × L) = 32)
chat.read.bulkhead.max-concurrent=${CHAT_READ_BULKHEAD:32}
# 측정 전용 지표(메시지 단계 분해·느린 주기 기록·스레드별 CPU)와 Prometheus·actuator는 운영에서 끈다(기본값 그대로). 명시해 둔다
chat.metrics.send-stages=false
chat.metrics.read-agg-slow=false
chat.metrics.thread-cpu=false
