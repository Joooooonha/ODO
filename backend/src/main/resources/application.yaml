spring:
  application:
    name: odo
  task:
    scheduling:
      pool:
        # 스케줄 작업(투표 작업자, 시계 감시, 토큰 정리, 연습 영상 청소, 알림 감지)마다 스레드를 하나씩 둔다. 기본값(1개)이면 시계 감시가
        # 기준 서버의 응답을 기다리는 동안 투표 작업자도 멈춘다. 스케줄 작업을 더하면 이 값도 올린다.
        size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

odo:
  frontend-base-url: ${ODO_FRONTEND_BASE_URL}
  auth:
    # 둘 다 32바이트 이상. 서로 다른 값을 쓴다.
    jwt-secret: ${ODO_JWT_SECRET}
    oauth-cookie-secret: ${ODO_OAUTH_COOKIE_SECRET}
  crypto:
    # 키는 32바이트를 base64로 넣는다(openssl rand -base64 32). 키를 바꿀 때는 새 버전을 추가하고 current-key-version을 바꾼다.
    # 옛 버전의 키는 그 버전의 암호문이 남지 않을 때까지 지우지 않는다.
    current-key-version: ${ODO_DATA_KEY_CURRENT}
    data-keys:
      v1: ${ODO_DATA_KEY_V1}
  vote:
    # 도착 시각을 찍은 뒤 처리하기까지 기다리는 시간(W). 1차는 고정이다(03_Schedule_spec.md의 "W = 4초와 오차 예산").
    wait: 4s
    # 작업자가 다시 돌기까지 기다리는 가장 긴 시간. 작업자는 가장 이른 처리 시각(도착 + W)에 깨어나고,
    # 늦어도 이 주기마다 확인한다(03_Schedule_spec.md의 "작업자 운영").
    poll-interval: 200ms
    worker-enabled: true
  clock:
    # 시계 차이를 잴 기준 시간 서버(SNTP). 비어 있으면 감시를 끈다.
    reference-host: ${ODO_CLOCK_REFERENCE_HOST:}
    check-interval: 30s
  storage:
    # 파일 저장소(Cloudflare R2)의 S3 API 주소, 버킷, 접근 키. 비어 있으면 서버가 뜨지 않는다(08_PracticeVideo_spec.md의 "저장소").
    endpoint: ${ODO_STORAGE_ENDPOINT}
    bucket: ${ODO_STORAGE_BUCKET}
    access-key-id: ${ODO_STORAGE_ACCESS_KEY_ID}
    secret-access-key: ${ODO_STORAGE_SECRET_ACCESS_KEY}
  practice-video:
    # 업로드 주소의 만료. 이 안에 전송을 시작해야 한다.
    upload-url-ttl: 30m
    # 업로드 시작부터 완료까지의 기한. 지나면 실패로 보고 청소 작업이 지운다.
    upload-deadline: 6h
    # 재생 주소의 만료. 한 번 연습하는 시간(2~3시간)을 덮는다.
    playback-url-ttl: 3h
    page-size: 20
    cleanup-interval: 10m
    cleanup-enabled: true
  notification:
    page-size: 20
    # 감지 주기. 새 알림이 보이기까지의 최대 지연이다(1초 안이면 실시간으로 느낀다).
    poll-interval: 500ms
    # 이 시간 동안 보낸 것이 없으면 빈 신호를 보낸다. 로드 밸런서의 유휴 끊김(보통 60초)보다 짧게 둔다.
    heartbeat-interval: 25s
    reconnect-retry: 3s
    catch-up-limit: 100
    detector-enabled: true
