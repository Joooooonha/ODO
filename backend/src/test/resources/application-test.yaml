odo:
  frontend-base-url: http://localhost:5173
  auth:
    # 테스트 전용 값. 운영에서는 환경 변수로 넣는다.
    jwt-secret: test-jwt-secret-0123456789abcdef0123456789abcdef
    oauth-cookie-secret: test-oauth-cookie-secret-0123456789abcdef01234567
  crypto:
    # 테스트 전용 키(32바이트). 운영에서는 환경 변수로 넣는다.
    current-key-version: v1
    data-keys:
      v1: dGVzdC1kYXRhLWtleS0wMTIzNDU2Nzg5YWJjZGVmMDE=
  vote:
    # 테스트는 작업자를 끄고 processDue()를 직접 불러 결과가 매번 같게 한다.
    worker-enabled: false
  clock:
    # 테스트는 기준 시간 서버에 붙지 않는다(감시를 끈다).
    reference-host: ""

spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
